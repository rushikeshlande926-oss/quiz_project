{% comment %}One horizontal bar of a chart. Use: {% include "components/hbar.html" with row=r %} (row has label, full, percent, text, low){% endcomment %}<div class="hbar" title="{{ row.full }}">
  <span class="hbar-label">{{ row.label }}</span>
  <span class="hbar-track"><span class="hbar-fill {% if row.low %}low{% endif %}" style="width: {{ row.percent }}%; display:block"></span></span>
  <span class="hbar-value">{{ row.text }}</span>
</div>
